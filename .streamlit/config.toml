[theme]
base = "dark"
primaryColor = "#ff6f61"
backgroundColor = "#0e1117"  # Canvas background color in dark mode
secondaryBackgroundColor = "#40404f"
textColor = "#ffffff"
font = "Roboto, sans-serif"
codeFont = "monospace"

[theme.sidebar]
backgroundColor = "#1c1e26"  # History section color in dark mode

[theme.header]
backgroundColor = "#3c3c4f"

[theme.css]
customCSS = """
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

[data-testid="stAppViewContainer"] > .main {
    background-image: url('data:image/jpeg;base64,INSERT_YOUR_BASE64_STRING_HERE'); 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

.st-chat {
    background-color: #0e1117;
    color: #ffffff;
    font-family: 'Roboto', sans-serif;
    font-size: 16px;
}

.st-chat .user-message {
    background-color: #44475a;
    color: #ffffff;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
}

.st-chat .bot-message {
    background-color: #4f4f67;
    color: #ffffff;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
}

.st-chat .st-chat-message-input {
    background-color: #333344;
    color: #ffffff;
    border: 1px solid #555555;
}

.st-chat .st-chat-send-button {
    background-color: #ff6f61;
    color: #ffffff;
    border-radius: 8px;
    padding: 10px 20px;
}
"""
